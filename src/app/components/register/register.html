<form>
  <div class="input-group">
    <span class="input-group-text">
      <i class="fas fa-envelope"></i>
    </span>
    <input type="email" [(ngModel)]="email" name="email" class="form-control" placeholder="Email address" required />
  </div>

  <div class="input-group">
    <span class="input-group-text">
      <i class="fas fa-lock"></i>
    </span>
    <input type="password" [(ngModel)]="password" name="password" class="form-control" placeholder="Password" required />
  </div>

  <div class="input-group">
    <span class="input-group-text">
      <i class="fas fa-lock"></i>
    </span>
    <input type="password" [(ngModel)]="confirmPassword" name="confirmPassword" class="form-control" placeholder="Confirm password" required />
  </div>

  <button type="submit" (click)="register()" class="btn btn-primary w-100 mt-2">
    <i class="fas fa-user-plus me-2"></i>Create Account
  </button>
</form>
