<div class="register-container">
  <h2>Create Account</h2>
  <div *ngIf="errorMsg()" class="alert alert-danger">{{ errorMsg() }}</div>
  
  <div class="form-group">
    <label>Email</label>
    <input type="email" [(ngModel)]="email" class="form-control" />
  </div>

  <div class="form-group">
    <label>Password</label>
    <input type="password" [(ngModel)]="password" class="form-control" />
  </div>

  <div class="form-group">
    <label>Confirm Password</label>
    <input type="password" [(ngModel)]="confirmPassword" class="form-control" />
  </div>

  <button (click)="register()" class="btn btn-primary w-100 mt-3">Register</button>
  <p class="mt-2">
    Already have an account? <a routerLink="/login">Login here</a>
  </p>
</div>
